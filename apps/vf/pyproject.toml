[project]
name = "video-factory"
version = "0.1.0"
description = "Grounded AI Video Factory - Standalone pipeline generating short-form videos from Product Intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "typing-extensions>=4.8.0",
    "mcp>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "av>=18.1.0",
    "playwright>=1.63.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scikit-image>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
video-factory = "video_factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
