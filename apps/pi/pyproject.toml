[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-scout-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "ddgs==9.14.4",
  "httpx==0.28.1",
  "ImageHash>=4.3,<5",
  "mcp>=1.2,<2",
  "openai==2.16.0",
  "openpyxl==3.1.5",
  "Pillow==12.2.0",
  "playwright==1.62.0",
  "pydantic>=2.10,<3",
  "python-dotenv==1.2.2",
  "python-telegram-bot[job-queue]==22.8",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-httpx>=0.35,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["product_scout*"]
